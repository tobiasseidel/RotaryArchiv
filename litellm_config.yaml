# litellm_config.yaml - MCP Server Integration
#
# Dies ist die Konfiguration für den RotaryArchiv MCP Server.
# Füge diese Zeilen in deine bestehende litellm_config.yaml ein.
#
# Der MCP Server muss im selben Docker-Network laufen wie litellm.

mcp_servers:
  # RotaryArchiv MCP Server (SSE/HTTP)
  rotary_archiv:
    transport: "sse"
    url: "http://rotary_mcp:8001/sse"
    description: "RotaryArchiv - Dokumente, OCR, Suche"

litellm_settings:
  # Aliases für einfachere Tool-Adresse
  mcp_aliases:
    "archiv": "rotary_archiv"
    "docs": "rotary_archiv"
